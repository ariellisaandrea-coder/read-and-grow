<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Read and Grow</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Create Account</h1>

<form id="signup-form">

<input
type="text"
id="full-name"
placeholder="Full Name"
required
>

<input
type="email"
id="email"
placeholder="Email Address"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit">

Create Account

</button>

</form>

<p id="signup-message"></p>

<script src="js/signup.js"></script>

</body>

</html>
