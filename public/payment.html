<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Payment | Read and Grow</title>

<link
rel="stylesheet"
href="style.css"
>

</head>


<body>

<header>

<h1>
Read and Grow
</h1>

<p>
Secure Payment
</p>

</header>


<main
class="payment-container"
>

<section
class="payment-box"
>

<h2>
Complete Your Payment
</h2>


<div
id="selected-payment"
>

Card Payment

</div>


<div id="payment-action">

<label for="demo-card-number">
Demo Card Number
</label>

<input
type="text"
id="demo-card-number"
placeholder="Enter sample digits"
inputmode="numeric" >
<label for="demo-expiry"> Demo Expiry Date</label>
<input type="text" id="demo-expiry" placeholder="MM/YY">
<Label for="demo-cvv"> Demo CVV</Label>
<input type="password" id="demo-cvv" placeholder="3 digits" inputmode="numeric" maxlength="3">
<button id="pay-button">
Pay Now
</button>

</div>


<p
id="payment-message"
>

</p>

</section>

</main>


<script
src="js/payment.js"
></script>

</body>

</html>
