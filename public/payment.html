<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Read and Grow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Read and Grow</h1>
    <p>Secure Payment</p>
  </header>

  <main class="payment-container">
    <section class="payment-box">
      <h2>Complete Your Payment</h2>

      <!-- FIX: the old file had a stray extra </div> that unbalanced the page -->
      <div id="payment-action">
        <label for="card-number">Card Number</label>
        <input type="text" id="card-number" placeholder="Enter digits" inputmode="numeric">

        <label for="card-expiry">Card Expiry Date</label>
        <input type="text" id="card-expiry" placeholder="MM/YY">

        <label for="card-cvv">Card CVV</label>
        <input type="password" id="card-cvv" placeholder="3 digits" inputmode="numeric" maxlength="3">
      </div>

      <button id="pay-button">Pay Now</button>

      <p id="payment-message"></p>
    </section>
  </main>

  <script src="js/payment.js"></script>
</body>
</html>
