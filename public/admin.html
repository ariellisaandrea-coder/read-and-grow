<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<h1>Read and Grow Admin</h1>

</header>

<main>

<h2>Add a New Book</h2>

<form id="add-book-form">

<label>Title</label>

<input
type="text"
id="title"
required
>

<label>Author</label>

<input
type="text"
id="author"
required
>

<label>Category</label>

<input
type="text"
id="category"
required
>

<label>Price</label>

<input
type="number"
step="0.01"
id="price"
required
>
<label>Description</label>

<textarea
id="description"
rows="5"
required>
</textarea>

<button type="submit">

Add Book

</button>

</form>

<hr>

<h2>Books</h2>

<div id="admin-books"></div>

</main>

<script src="js/admin.js"></script>

</body>

</html>
