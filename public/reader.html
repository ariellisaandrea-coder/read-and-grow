<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Read Book | Read and Grow</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<h1>Read and Grow</h1>
<p>Book Reader</p>
</header>

<main class="reader-container">

<section class="reader-box">

<p id="reader-message">
Checking your book access...
</p>
<div id="reading-progress-container">

<p id="reading-progress-text">
Reading Progress: 0%
</p>

<div id="reading-progress-bar-background">

<div id="reading-progress-bar"></div>

</div>

</div>

<div id="table-of-contents">

<h2>📑 Table of Contents</h2>

<div id="chapter-list">
Loading chapters...
</div>

</div>

<div id="book-reader"></div>


<div class="reader-navigation">

<button id="previous-chapter">
← Previous Chapter
</button>

<button id="next-chapter">
Next Chapter →
</button>

</div>

<button id="back-to-library">
Back to My Library
</button>


</section>

</main>

<script src="js/reader.js"></script>

</body>

</html>
